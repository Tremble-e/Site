<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tremble — Mathématiques &amp; Développement</title>
  <desc id="desc">Emblème géométrique bleu et violet associant code et mathématiques.</desc>
  <defs>
